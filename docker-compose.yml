services:
  db:
    image: pgvector/pgvector:pg16
    container_name: curio-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: curio
      POSTGRES_PASSWORD: curio_dev_password
      POSTGRES_DB: curio
    volumes:
      - curio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  curio_pgdata:
